  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no"

    <title>Doodle Jump</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap");
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: #1a1a2e;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        font-family: "Press Start 2P", monospace;
        overflow: hidden;
        image-rendering: pixelated;
      }
      #wrapper {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0;
      }
      #hud {
        width: 360px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 7px 14px;
        background: #16213e;
        border: 3px solid #0f3460;
        border-bottom: none;
        box-shadow:
          3px 0 0 #0f3460,
          -3px 0 0 #0f3460,
          0 -3px 0 #0f3460;
      }
      #score-val {
        color: #e0e0e0;
        font-size: 10px;
      }
      #best-val {
        color: #f5a623;
        font-size: 10px;
      }
      canvas {
        display: block;
        border: 3px solid #0f3460;
        border-top: none;
        image-rendering: pixelated;
        cursor: none;
      }
      #hint {
        color: #334466;
        font-size: 7px;
        margin-top: 6px;
        letter-spacing: 1px;
      }
    </style>
    <script>
      // ── 8-bit Sound Engine ────────────────────────────────────────────────────────
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      let actx = null;

      function getACtx() {
        if (!actx) actx = new AudioCtx();
        return actx;
      }

      function playTone({
        freq = 440,
        freq2 = null,
        type = "square",
        vol = 0.18,
        duration = 0.12,
        attack = 0.005,
        decay = 0.05,
      }) {
        try {
          const ctx = getACtx();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.connect(gain);
          gain.connect(ctx.destination);

          osc.type = type;
          osc.frequency.setValueAtTime(freq, ctx.currentTime);
          if (freq2)
            osc.frequency.linearRampToValueAtTime(
              freq2,
              ctx.currentTime + duration,
            );

          gain.gain.setValueAtTime(0, ctx.currentTime);
          gain.gain.linearRampToValueAtTime(vol, ctx.currentTime + attack);
          gain.gain.exponentialRampToValueAtTime(
            0.001,
            ctx.currentTime + duration,
          );

          osc.start(ctx.currentTime);
          osc.stop(ctx.currentTime + duration);
        } catch (e) {}
      }

      // 一般跳躍音
      function sfxJump() {
        playTone({
          freq: 220,
          freq2: 440,
          type: "square",
          vol: 0.15,
          duration: 0.1,
        });
      }

      // 彈簧音（更高更長）
      function sfxSpring() {
        playTone({
          freq: 300,
          freq2: 900,
          type: "square",
          vol: 0.2,
          duration: 0.18,
        });
      }

      // 破碎平台音
      function sfxBreak() {
        playTone({
          freq: 200,
          freq2: 80,
          type: "sawtooth",
          vol: 0.2,
          duration: 0.18,
        });
      }

      // 墜落音（快速螺旋下降，像卡通落下效果）
      function sfxDead() {
        // 主墜落音：高頻快速滑落
        playTone({
          freq: 800,
          freq2: 60,
          type: "square",
          vol: 0.22,
          duration: 0.7,
        });
        // 第二層：諧波增加厚度
        setTimeout(
          () =>
            playTone({
              freq: 400,
              freq2: 30,
              type: "sawtooth",
              vol: 0.15,
              duration: 0.5,
            }),
          50,
        );
        // 結尾撞擊音
        setTimeout(
          () =>
            playTone({
              freq: 80,
              freq2: 40,
              type: "square",
              vol: 0.25,
              duration: 0.2,
            }),
          650,
        );
      }

      // 破紀錄音
      function sfxBest() {
        [523, 659, 784, 1047].forEach((f, i) => {
          setTimeout(
            () =>
              playTone({ freq: f, type: "square", vol: 0.18, duration: 0.12 }),
            i * 80,
          );
        });
      }
    </script>

      const pixCanvas = document.createElement("canvas");
      pixCanvas.width = CHAR_W;
      pixCanvas.height = CHAR_H;
      const pixCtx = pixCanvas.getContext("2d");
      pixCtx.imageSmoothingEnabled = false;

      const smallCanvas = document.createElement("canvas");
      smallCanvas.width = PIX_RES;
      smallCanvas.height = PIX_RES;
      const smallCtx = smallCanvas.getContext("2d");
      smallCtx.imageSmoothingEnabled = false;

      let charReady = false;
      charImg.onload = () => {
        // 圖片本身已是像素風，直接畫上去
        pixCtx.imageSmoothingEnabled = false;
        pixCtx.drawImage(charImg, 0, 0, CHAR_W, CHAR_H);
        charReady = true;
      };

      // ── Game constants ─────────────────────────────────────────────────────────────
      const GRAVITY = 0.42;
      const JUMP_FORCE = -13.2;
      const PLAT_W = 68;
      const PLAT_H = 12;
      const PLAT_COUNT = 11;
      const MOVE_SPEED = 4.5;
      const PLAT_MIN_GAP = 52;
      const PLAT_MAX_GAP = 112;

      let player, platforms, camera, score, particles, gameState, keys;

      function makePlat(x, y, type = 0) {
        return {
          x: Math.round(x),
          y: Math.round(y),
          w: PLAT_W,
          h: PLAT_H,
          type,
          dir: 1,
          speed: 1.3 + Math.random() * 1.2,
          broken: false,
          breakTimer: 0,
          springExt: 0,
        };
      }
      function genPlatforms() {
        const ps = [];
        let px = W / 2 - PLAT_W / 2;
        ps.push(makePlat(px, H - 80, 0));
        let y = H - 80;
        for (let i = 0; i < PLAT_COUNT - 1; i++) {
          const gap =
            PLAT_MIN_GAP + Math.random() * (PLAT_MAX_GAP - PLAT_MIN_GAP);
          y -= gap;
          // 計算此間距下可橫移最大距離
          const g = GRAVITY,
            v0 = Math.abs(JUMP_FORCE);
          const disc = v0 * v0 - 2 * g * gap;
          const tUp = disc > 0 ? (v0 - Math.sqrt(disc)) / g : v0 / g;
          const reach = MOVE_SPEED * tUp + PLAT_W;
          // 以上一個平台中心為基準，限制 x 範圍
          const refCx = px + PLAT_W / 2;
          const minX = Math.max(0, refCx - reach);
          const maxX = Math.min(W - PLAT_W, refCx + reach - PLAT_W);
          px = minX + Math.random() * Math.max(0, maxX - minX);
          const r = Math.random();
          let t = 0;
          if (score > 150) {
            if (r < 0.15) t = 1;
            else if (r < 0.27) t = 2;
            else if (r < 0.33) t = 3;
          }
          ps.push(makePlat(px, y, t));
        }
        return ps;
      }
      function init() {
        player = {
          x: W / 2 - CHAR_W / 2,
          y: H - 120,
          vx: 0,
          vy: JUMP_FORCE,
          dir: 1,
          jumpAnim: 0,
        };
        platforms = genPlatforms();
        camera = 0;
        score = 0;
        particles = [];
        gameState = "playing";
        scoreEl.textContent = "SCORE 0";
      }

      // ── Input ──────────────────────────────────────────────────────────────────────
      keys = {};
      document.addEventListener("keydown", (e) => (keys[e.key] = true));
      document.addEventListener("keyup", (e) => (keys[e.key] = false));

      // ── 觸控滑動（永遠啟用，適用所有裝置）────────────────────
      let tX = null;
      canvas.addEventListener(
        "touchstart",
        (e) => {
          tX = e.touches[0].clientX;
        },
        { passive: true },
      );
      canvas.addEventListener(
        "touchmove",
        (e) => {
          e.preventDefault();
          if (tX === null) return;
          const dx = e.touches[0].clientX - tX;
          keys["ArrowRight"] = dx > 8;
          keys["ArrowLeft"] = dx < -8;
        },
        { passive: false },
      );
      canvas.addEventListener(
        "touchend",
        () => {
          keys["ArrowLeft"] = keys["ArrowRight"] = false;
          tX = null;
        },
        { passive: true },
      );

      // ── 陀螺儀（功能偵測，有支援就啟用）─────────────────────
      let gyroEnabled = false;
      let gyroActive = false; // 是否偵測到有效的陀螺儀數據

      function startGyro() {
        window.addEventListener(
          "deviceorientation",
          (e) => {
            if (!gyroEnabled) return;
            // 若 gamma 非 null 代表裝置有陀螺儀
            if (e.gamma === null) return;
            gyroActive = true;
            const gamma = e.gamma; // 左右傾斜 -90 ~ 90
            const dead = 5; // 死區，防止漂移
            if (gamma < -dead) {
              keys["ArrowLeft"] = true;
              keys["ArrowRight"] = false;
            } else if (gamma > dead) {
              keys["ArrowRight"] = true;
              keys["ArrowLeft"] = false;
            } else {
              keys["ArrowLeft"] = false;
              keys["ArrowRight"] = false;
            }
          },
          true,
        );
      }

      if (typeof DeviceOrientationEvent !== "undefined") {
        if (typeof DeviceOrientationEvent.requestPermission === "function") {
          // iOS 13+ 需要使用者手勢觸發授權
          const permBtn = document.createElement("button");
          permBtn.textContent = "🎮 啟用陀螺儀";
          permBtn.style.cssText =
            "position:fixed;bottom:70px;left:50%;transform:translateX(-50%);" +
            "padding:10px 22px;background:#4488ff;color:#fff;border:none;" +
            "border-radius:20px;font-size:14px;z-index:999;cursor:pointer;" +
            "box-shadow:0 2px 8px rgba(0,0,0,0.4);";
          document.body.appendChild(permBtn);
          permBtn.addEventListener("click", () => {
            DeviceOrientationEvent.requestPermission()
              .then((state) => {
                if (state === "granted") {
                  startGyro();
                  gyroEnabled = true;
                }
                permBtn.remove();
              })
              .catch(() => permBtn.remove());
          });
        } else {
          // Android / 其他：直接嘗試啟用，測試一次看有無數據
          startGyro();
          gyroEnabled = true;
        }
      }

      // ── Particles ──────────────────────────────────────────────────────────────────
      function spawnPx(x, y, color, n = 6) {
        for (let i = 0; i < n; i++) {
          const a = (Math.PI * 2 * i) / n + Math.random() * 0.5,
            s = 1.5 + Math.random() * 3;
          particles.push({
            x,
            y,
            vx: Math.cos(a) * s,
            vy: Math.sin(a) * s - 1.5,
            life: 1,
            decay: 0.05 + Math.random() * 0.03,
            sz: (1 + Math.floor(Math.random() * 2)) * 3,
            color,
          });
        }
      }

      // ── Update ─────────────────────────────────────────────────────────────────────
      function update() {
        if (gameState === "dead" || gameState === "start") return;
        // falling 狀態：跳過一般操作邏輯，直接到下方 falling 區塊
        if (gameState === "falling") {
          // 墜落動畫
          player.fallTimer = (player.fallTimer || 0) + 1;
          player.vy = Math.min((player.vy || 0) + 0.8, 18);
          player.vx = (player.vx || 0) * 0.96;
          player.x += player.vx;
          player.y += player.vy;
          player.fallScale = Math.max(0, 1 - player.fallTimer / 40);
          if (player.fallTimer > 55) {
            gameState = "dead";
            if (score > best) {
              best = score;
              localStorage.setItem("djv3_best", best);
              bestEl.textContent = "BEST " + best;
              sfxBest();
            }
          }
          return;
        }
        if (keys["ArrowLeft"]) {
          player.vx = -MOVE_SPEED;
          player.dir = -1;
        } else if (keys["ArrowRight"]) {
          player.vx = MOVE_SPEED;
          player.dir = 1;
        } else player.vx *= 0.75;

        player.vy += GRAVITY;
        player.x += player.vx;
        player.y += player.vy;
        if (player.x > W) player.x = -CHAR_W;
        if (player.x < -CHAR_W) player.x = W;

        const thr = H * 0.38;
        if (player.y < thr) {
          const d = thr - player.y;
          camera += d;
          player.y += d;
          score = Math.max(score, Math.floor(camera / 55));
          scoreEl.textContent = "SCORE " + score;
          for (const p of platforms) p.y += d;
          for (const p of particles) p.y += d;
        }
        if (player.jumpAnim > 0) player.jumpAnim -= 0.1;

        for (const p of platforms) {
          if (p.type === 1) {
            p.x += p.dir * p.speed;
            if (p.x < 0 || p.x + p.w > W) p.dir *= -1;
          }
          if (p.type === 2 && p.broken) p.breakTimer++;
          if (p.springExt > 0) p.springExt -= 0.15;
        }

        if (player.vy > 0) {
          const foot = player.y + CHAR_H - 4;
          for (const p of platforms) {
            if (p.type === 2 && p.broken) continue;
            const pf = foot - player.vy;
            if (
              pf <= p.y &&
              foot >= p.y &&
              player.x + CHAR_W - 8 > p.x &&
              player.x + 8 < p.x + p.w
            ) {
              if (p.type === 2) {
                p.broken = true;
                spawnPx(p.x + p.w / 2, p.y, "#cc4422", 10);
                player.vy = JUMP_FORCE * 0.3;
                sfxBreak();
              } else if (p.type === 3) {
                p.springExt = 1;
                player.vy = JUMP_FORCE * 1.65;
                player.jumpAnim = 1;
                spawnPx(p.x + p.w / 2, p.y, "#ffaa00", 12);
                sfxSpring();
              } else {
                player.vy = JUMP_FORCE;
                player.jumpAnim = 1;
                spawnPx(p.x + p.w / 2, p.y, "#44cc44", 6);
                sfxJump();
              }
              break;
            }
          }
        }

        platforms = platforms.filter(
          (p) => p.y < H + 30 && !(p.type === 2 && p.breakTimer > 18),
        );
        while (platforms.length < PLAT_COUNT) {
          // 找最高（y最小）平台作為參考
          const topPlat = platforms.reduce(
            (b, p) => (p.y < b.y ? p : b),
            platforms[0],
          );
          const topY = topPlat.y;
          const gap =
            PLAT_MIN_GAP + Math.random() * (PLAT_MAX_GAP - PLAT_MIN_GAP);
          // 物理計算：上升到 gap 高度的時間，進而得出水平可達範圍
          const g = GRAVITY,
            v0 = Math.abs(JUMP_FORCE);
          const disc = v0 * v0 - 2 * g * gap;
          const tUp = disc > 0 ? (v0 - Math.sqrt(disc)) / g : v0 / g;
          const reach = MOVE_SPEED * tUp + PLAT_W;
          const refCx = topPlat.x + PLAT_W / 2;
          const minX = Math.max(0, refCx - reach);
          const maxX = Math.min(W - PLAT_W, refCx + reach - PLAT_W);
          const x = minX + Math.random() * Math.max(0, maxX - minX);
          const r = Math.random();
          let t = 0;
          if (score > 100) {
            if (r < 0.17) t = 1;
            else if (r < 0.3) t = 2;
            else if (r < 0.37) t = 3;
          }
          platforms.push(makePlat(x, topY - gap, t));
        }

        for (const p of particles) {
          p.x += p.vx;
          p.y += p.vy;
          p.vy += 0.1;
          p.life -= p.decay;
        }
        particles = particles.filter((p) => p.life > 0);

        // 落出畫面底部 → 進入墜落動畫
        if (player.y > H + 20 && gameState === "playing") {
          gameState = "falling";
          player.fallTimer = 0;
          sfxDead();
        }
      }

      // ── Draw ───────────────────────────────────────────────────────────────────────
      function drawPlat(p) {
        const cols = [
          ["#44bb44", "#227722", "#88ee88"],
          ["#4488ff", "#2255cc", "#88bbff"],
          ["#ee4433", "#992211", "#ff8877"],
          ["#ffbb00", "#aa7700", "#ffdd66"],
        ];
        const [top, bot, shine] = cols[p.type] || cols[0];
        const sH = p.type === 3 ? Math.round(5 + p.springExt * 10) : 0;
        if (sH > 0) {
          ctx.fillStyle = bot;
          ctx.fillRect(
            p.x + Math.round(p.w * 0.36),
            p.y - sH,
            Math.round(p.w * 0.28),
            sH,
          );
          ctx.fillStyle = top;
          ctx.fillRect(
            p.x + Math.round(p.w * 0.4),
            p.y - sH,
            Math.round(p.w * 0.2),
            sH,
          );
        }
        const ty = p.y - sH;
        ctx.fillStyle = "rgba(0,0,0,0.2)";
        ctx.fillRect(p.x + 3, ty + p.h, p.w - 2, 3);
        ctx.fillStyle = bot;
        ctx.fillRect(p.x + 1, ty + p.h - 3, p.w - 2, 3);
        ctx.fillStyle = top;
        ctx.fillRect(p.x, ty, p.w, p.h - 3);
        ctx.fillStyle = shine;
        ctx.fillRect(p.x + 3, ty + 1, p.w - 6, 2);
        if (p.type === 2 && !p.broken) {
          ctx.fillStyle = "rgba(0,0,0,0.35)";
          for (let i = 0; i < 3; i++) {
            const cx = p.x + 10 + i * 20;
            ctx.fillRect(cx, ty + 3, 1, 5);
            ctx.fillRect(cx - 1, ty + 7, 3, 1);
          }
        }
      }

      function drawPlayer() {
        const p = player;
        const sqY = p.jumpAnim > 0 ? 1 + p.jumpAnim * 0.18 : 1,
          sqX = 1 / sqY;
        // 墜落縮小 + 旋轉
        const fallScale =
          gameState === "falling" ? Math.max(0.05, p.fallScale || 1) : 1;
        const fallRot = gameState === "falling" ? (p.fallTimer || 0) * 0.12 : 0;

        ctx.save();
        ctx.translate(p.x + CHAR_W / 2, p.y + CHAR_H / 2);
        ctx.rotate(fallRot);
        ctx.scale(p.dir * sqX * fallScale, sqY * fallScale);
        // shadow（墜落時漸隱）
        if (gameState !== "falling") {
          ctx.fillStyle = "rgba(0,0,0,0.15)";
          ctx.fillRect(-CHAR_W * 0.4, CHAR_H * 0.38, CHAR_W * 0.8, 4);
        }
        if (charReady) {
          ctx.imageSmoothingEnabled = false;
          ctx.globalAlpha =
            gameState === "falling" ? Math.max(0, p.fallScale || 1) : 1;
          ctx.drawImage(pixCanvas, -CHAR_W / 2, -CHAR_H / 2, CHAR_W, CHAR_H);
          ctx.globalAlpha = 1;
        }
        ctx.restore();
      }

      function drawOverlay(state) {
        ctx.fillStyle = "rgba(10,15,40,0.92)";
        ctx.fillRect(0, 0, W, H);
        ctx.textAlign = "center";
        if (state === "start") {
          ctx.fillStyle = "#0f3460";
          ctx.font = 'bold 26px "Press Start 2P"';
          ctx.fillText("DOODLE", W / 2, H / 2 - 100);
          ctx.fillStyle = "#cccccc";
          ctx.font = 'bold 26px "Press Start 2P"';
          ctx.fillText("JUMP", W / 2, H / 2 - 62);
          if (charReady) {
            ctx.imageSmoothingEnabled = false;
            ctx.drawImage(pixCanvas, W / 2 - 40, H / 2 - 40, 80, 80);
          }
          ctx.fillStyle = "#0f3460";
          ctx.font = '8px "Press Start 2P"';
          ctx.fillText("TAP OR PRESS KEY TO START", W / 2, H / 2 + 70);
        } else {
          ctx.fillStyle = "#ff5555";
          ctx.font = '14px "Press Start 2P"';
          ctx.fillText("GAME OVER", W / 2, H / 2 - 100);
          ctx.fillStyle = "#cccccc";
          ctx.font = '9px "Press Start 2P"';
          ctx.fillText("SCORE", W / 2, H / 2 - 60);
          ctx.fillStyle = "#0f3460";
          ctx.font = '22px "Press Start 2P"';
          ctx.fillText(score, W / 2, H / 2 - 30);
          ctx.fillStyle = "#aaaaaa";
          ctx.font = '8px "Press Start 2P"';
          ctx.fillText("BEST", W / 2, H / 2 + 6);
          ctx.fillStyle = "#cc7700";
          ctx.font = '14px "Press Start 2P"';
          ctx.fillText(best, W / 2, H / 2 + 30);
          // button
          const bx = 95,
            by = H / 2 + 55,
            bw = 170,
            bh = 44;
          ctx.fillStyle = "#050d1a";
          ctx.fillRect(bx + 3, by + 3, bw, bh);
          ctx.fillStyle = "#0f3460";
          ctx.fillRect(bx, by, bw, bh);
          ctx.fillStyle = "#1a5fa8";
          ctx.fillRect(bx + 2, by + 2, bw - 4, 4);
          ctx.fillStyle = "#fff";
          ctx.font = '9px "Press Start 2P"';
          ctx.fillText("PLAY AGAIN", W / 2, by + 28);
          canvas.onclick = function (e) {
            const r = canvas.getBoundingClientRect();
            const mx = (e.clientX - r.left) * (W / r.width),
              my = (e.clientY - r.top) * (H / r.height);
            if (mx > bx && mx < bx + bw && my > by && my < by + bh) {
              canvas.onclick = null;
              init();
            }
          };
        }
      }

      function draw() {
        // Notebook paper background
        ctx.fillStyle = "#1a1a2e";
        ctx.fillRect(0, 0, W, H);

        // Horizontal lines (graph paper style)
        ctx.strokeStyle = "rgba(80,120,200,0.12)";
        ctx.lineWidth = 1;
        const ls = 24,
          lo = Math.round(camera) % ls;
        for (let y = lo % ls; y < H; y += ls) {
          ctx.beginPath();
          ctx.moveTo(0, y);
          ctx.lineTo(W, y);
          ctx.stroke();
        }
        // Vertical lines (lighter)
        ctx.strokeStyle = "rgba(80,120,200,0.06)";
        for (let x = 0; x < W; x += 24) {
          ctx.beginPath();
          ctx.moveTo(x, 0);
          ctx.lineTo(x, H);
          ctx.stroke();
        }

        // Red margin line
        ctx.strokeStyle = "rgba(100,160,255,0.18)";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(42, 0);
        ctx.lineTo(42, H);
        ctx.stroke();

        for (const p of platforms) drawPlat(p);

        for (const p of particles) {
          ctx.globalAlpha = p.life;
          ctx.fillStyle = p.color;
          ctx.fillRect(Math.round(p.x), Math.round(p.y), p.sz, p.sz);
        }
        ctx.globalAlpha = 1;

        if (
          gameState === "playing" ||
          gameState === "dead" ||
          gameState === "falling"
        )
          drawPlayer();
        if (gameState === "start" || gameState === "dead")
          drawOverlay(gameState);
      }

      function loop() {
        update();
        draw();
        requestAnimationFrame(loop);
      }

      // Start
      gameState = "start";
      platforms = [];
      particles = [];
      player = {
        x: W / 2 - CHAR_W / 2,
        y: H - 200,
        vx: 0,
        vy: 0,
        dir: 1,
        jumpAnim: 0,
      };
      function startGame() {
        if (gameState === "start") {
          document.removeEventListener("keydown", startGame);
          canvas.removeEventListener("touchend", startGame);
          canvas.removeEventListener("click", startGame);
          init();
        }
      }
      document.addEventListener("keydown", startGame);
      // unlock audio on first interaction
      document.addEventListener("keydown", () => getACtx(), { once: true });
      canvas.addEventListener("click", () => getACtx(), { once: true });
      canvas.addEventListener("touchend", startGame, { passive: true });
      canvas.addEventListener("click", startGame);
      loop();
    </script>
  </body>
</html>
